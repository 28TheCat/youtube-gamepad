<!doctype html>
<html lang="zh-CN" data-ytg-popup>
<head><meta charset="utf-8"><title>YouTube Gamepad</title><link rel="stylesheet" href="ui/theme.css"><link rel="stylesheet" href="popup.css"></head>
<body>
<header><span class="brand-mark" aria-hidden="true">▶</span><div><h1>YouTube Gamepad</h1><p class="tagline">用手柄，轻松看视频</p></div></header>
<label class="toggle"><span>启用手柄操作</span><input id="enabled" type="checkbox" disabled></label>
<section class="connection-card" aria-labelledby="connectionTitle"><h2 id="connectionTitle">连接状态</h2><p id="connection" role="status">正在检查连接状态…</p></section>
<p class="quick-guide"><kbd>A</kbd> 确认 <kbd>B</kbd> 返回 <kbd>Start</kbd> 菜单</p>
<button id="moreSettings" type="button">打开完整设置 <span aria-hidden="true">↗</span></button>
<output id="status" role="status"></output>
<script src="ui/theme-sync.js"></script><script src="popup.js"></script>
</body></html>
